</script><script>const KEY='diwali-single-screen-v2';

function setup(){el.innerHTML=`<div class="eyebrow">Start with your people</div><h1>A little friendly rivalry.</h1><div class="split"><form id="teams-form" class="panel"><h2>Who's here?</h2><p class="muted">One name per line. Shuffle into balanced teams, then edit the names and members below.</p><textarea name="names" aria-label="Player names" placeholder="Samarth\nAditi\nRahul">${esc(state.teams.flatMap(t=>t.players).join('\n'))}</textarea><label>Teams <input name="count" type="number" min="2" max="10" value="${state.teams.length||4}" required></label><button class="primary">Assign teams randomly</button></form><div><h2>Tonight's lineup</h2><ol>${Object.values(games).map(g=>`<li>${g.name}</li>`).join('')}</ol><p class="muted">Everything happens on this screen. Progress saves in this browser.</p></div></div>${state.teams.length?`<form id="edit-teams"><div class="grid">${state.teams.map((t,i)=>`<section class="panel"><label>Team name<input name="name-${i}" value="${esc(t.name)}" required></label><textarea name="players-${i}" aria-label="Members of ${esc(t.name)}">${esc(t.players.join('\n'))}</textarea></section>`).join('')}</div><button class="primary">Save teams & choose a game →</button></form>`:''}`}
function menu(){el.innerHTML=bar()+`<div class="eyebrow">Your party, your pace</div><h1>Choose your next game.</h1>${state.round?'<button data-action="resume" class="primary">Return to current round →</button><br><br>':''}<div class="grid">${Object.entries(games).map(([key,g])=>`<section class="panel"><h2>${g.name}</h2><p>${g.rule}</p><p class="muted">${pool(key).length} prompts · ${g.seconds/60} minute${g.seconds===60?'':'s'}</p><button data-action="new" data-game="${key}" class="primary">Play ${g.name}</button></section>`).join('')}</div>`}
function clock(){const r=state.round;return r?Math.max(0,r.deadline?Math.ceil((r.deadline-Date.now())/1000):r.remaining):0}
function tick(){const t=document.querySelector('#timer');if(t){const n=clock();t.textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;t.classList.toggle('expired',n===0);if(n===0&&state.round.deadline){state.round.deadline=null;state.round.remaining=0;save();render()}}}
function brief(c){return `<h2>${esc(c.prompt)}</h2><p>${esc(c.brief)}</p><p class="muted">Suggested characters</p><ol>${(c.roles||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ol>`}
function round(){const r=state.round,g=games[r.game],c=CARDS.find(c=>c.id===r.cardId);el.innerHTML=bar()+`<div class="eyebrow">${g.name} · Round ${r.number}</div><div class="split"><section class="panel">${r.game==='skit'?`<h1>${r.stage==='prep'?'Time to get creative.':'Take the stage.'}</h1><p>${g.rule}</p>${r.stage==='performance'?`<label>Performing team <select id="performer">${options(state.teams,r.team)}</select></label>`:''}`:r.game==='bidding'?`<h1 class="prompt">${esc(c.prompt)}</h1><p>${g.rule}</p><label>Highest bidder <select id="bid-team">${options(state.teams,r.team)}</select></label><label>Winning bid <input id="bid" type="number" min="1" max="100" value="${r.bid}"></label><p>Success: <strong>+${r.bid*10}</strong> · Failure: <strong>−${r.bid*5}</strong></p><p class="muted">Answers are spoken by the team and judged by the host; this category has no fixed answer key.</p>`:`<h1>${g.name}</h1><p>${g.rule}</p><label>Playing team <select id="playing-team">${options(state.teams,r.team)}</select></label>${r.revealed?`<div class="prompt">${esc(c.prompt)}</div>${r.game==='taboo'?`<p class="tags">Don't say: ${c.forbidden.map(esc).join(' · ')}</p>`:''}<button data-action="reveal">Hide prompt</button>`:`<div class="hidden-card"><p>Prompt hidden</p><p class="muted">Make sure the guesser${r.game==='taboo'?'s are':' is'} facing away from the TV.</p><button data-action="reveal" class="primary">Reveal prompt / answer</button></div>`}`}</section><aside class="panel"><div class="eyebrow">${r.game==='skit'?r.stage==='prep'?'Preparation':'Performance':'Round timer'}</div><div id="timer" class="timer"></div><div class="actions"><button data-action="timer" class="primary">${r.deadline?'Pause':'Start / resume'}</button><button data-action="reset-timer">Reset timer</button></div>${r.game==='skit'?`<button data-action="stage">${r.stage==='prep'?'Start performances →':'Back to preparation'}</button>`:''}<p class="muted">The host controls when to reveal and award points. Time expiring never awards points automatically.</p></aside></div>${r.game==='skit'?`<div class="grid">${pool('skit').map((c,i)=>`<section class="panel">${brief(c)}<p class="eyebrow">Scenario ${i+1}</p>${state.teams.filter((t,j)=>r.assignments[j]===c.id).map(t=>`<strong>${esc(t.name)}</strong>`).join(' · ')}</section>`).join('')}</div><section class="panel"><h2>Assign scenarios</h2>${state.teams.map((t,i)=>`<label>${esc(t.name)} <select data-assignment="${i}">${pool('skit').map(c=>`<option value="${c.id}" ${r.assignments[i]===c.id?'selected':''}>${esc(c.prompt)}</option>`).join('')}</select></label>`).join('')}</section>`:''}<section class="panel"><h2>Award points</h2><form id="score-form" class="actions"><select name="team" aria-label="Team to score">${options(state.teams,r.team)}</select><input name="points" aria-label="Points" type="number" min="-1000" max="1000" value="${g.points}" required><button class="primary">Add points</button><button type="button" data-action="undo">Undo last award</button></form>${r.game==='bidding'?`<p><button data-action="bid-win">Success: +${r.bid*10}</button> <button data-action="bid-lose">Failure: −${r.bid*5}</button></p>`:''}<p class="muted">${r.game==='skit'?'Suggested: 0–30 per team.':r.game==='taboo'?'Suggested: +10 correct, −5 forbidden word.':'Host may adjust points as needed.'}</p>${ledger(state.history.filter(h=>h.roundId===r.id))}</section><div class="actions"><button data-action="new" data-game="${r.game}" class="primary">${r.game==='skit'?'New skit round':'Next prompt →'}</button><button data-action="games">Choose another game</button></div>`;tick()}
function ledger(rows){return rows.length?`<table><thead><tr><th>Team</th><th>Round / prompt</th><th>Points</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${esc(state.teams[h.team]?.name)}</td><td>${esc(h.title)}</td><td>${h.points>0?'+':''}${h.points}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No points awarded yet.</p>'}
function render(){if(state.page==='setup'||!state.teams.length)setup();else if(state.page==='round'&&state.round)round();else if(state.page==='scores')el.innerHTML=`<h1>The leaderboard.</h1>${[...state.teams].sort((a,b)=>b.score-a.score).map((t,i)=>`<div class="scorechip">${i+1}. ${esc(t.name)} <strong>${t.score}</strong></div>`).join('')}<h2>Every round, every point</h2>${ledger(state.history)}<p><button data-action="undo">Undo last award</button> <button data-action="games">Back to games</button></p>`;else menu()}
function newRound(game){if(state.round&&!confirm('Move to a new round? Recorded scores will stay.'))return;const choices=pool(game);let c=choices.find(c=>!state.used.includes(c.id));if(!c){if(!confirm('All prompts used. Start this deck again?'))return;state.used=state.used.filter(id=>!choices.some(c=>c.id===id));c=choices[0]}const number=(state.round?.number||0)+1;state.used.push(c.id);state.round={id:crypto.randomUUID(),number,game,cardId:c.id,title:game==='skit'?'Epic in 15':c.prompt,revealed:false,remaining:games[game].seconds,deadline:null,bid:1,team:0,stage:'prep',assignments:state.teams.map((_,i)=>pool('skit')[i%pool('skit').length].id)};state.page='round'}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{const a=b.dataset.action,r=state.round;if(['setup','games','scores'].includes(a))state.page=a;else if(a==='resume')state.page='round';else if(a==='new')newRound(b.dataset.game);else if(a==='reveal')r.revealed=!r.revealed;else if(a==='timer'){if(r.deadline){r.remaining=clock();r.deadline=null}else if(r.remaining>0)r.deadline=Date.now()+r.remaining*1000;}else if(a==='reset-timer'){r.deadline=null;r.remaining=r.game==='skit'&&r.stage==='performance'?180:games[r.game].seconds;}else if(a==='stage'){r.stage=r.stage==='prep'?'performance':'prep';r.deadline=null;r.remaining=r.stage==='prep'?900:180;}else if(a==='bid-win'||a==='bid-lose'){if(confirm(`Award ${a==='bid-win'?10*r.bid:-5*r.bid} to ${state.teams[r.team].name}?`))Party.award(state,r.team,(a==='bid-win'?10:-5)*r.bid)}else if(a==='undo')Party.undo(state);else if(a==='backup'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='diwali-single-screen-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}else if(a==='fullscreen'){if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}save();render()}catch(err){notice(err.message)}});
document.addEventListener('submit',e=>{e.preventDefault();try{const f=new FormData(e.target);if(e.target.id==='teams-form'){const names=String(f.get('names')).split('\n').map(x=>x.trim()).filter(Boolean);if(names.length>100)throw Error('Use up to 100 players.');if(state.history.length&&!confirm('Reassign teams and clear existing scores? Save a backup first if needed.'))return;const teams=Party.shuffle(names,Number(f.get('count')));state=Party.fresh();state.teams=teams;}else if(e.target.id==='edit-teams'){const teams=state.teams.map((t,i)=>({...t,name:String(f.get('name-'+i)).trim(),players:String(f.get('players-'+i)).split('\n').map(x=>x.trim()).filter(Boolean)}));if(teams.some(t=>!t.name||!t.players.length))throw Error('Each team needs a name and at least one player.');state.teams=teams;state.page='games';}else if(e.target.id==='score-form')Party.award(state,Number(f.get('team')),Number(f.get('points')));save();render()}catch(err){notice(err.message)}});
document.addEventListener('change',async e=>{try{const t=e.target,r=state.round;if(t.id==='restore'){const file=t.files[0];if(!file)return;if(file.size>2000000)throw Error('Backup is too large.');const restored=Party.validate(JSON.parse(await file.text()));if(!confirm('Replace current progress with this backup?'))return;state=restored;if(state.round){state.round.remaining=clock();state.round.deadline=null;}}else if(t.id==='bid'){const n=Number(t.value);if(!Number.isInteger(n)||n<1||n>100)throw Error('Bid must be from 1 to 100.');r.bid=n;}else if(['bid-team','playing-team','performer'].includes(t.id)){r.team=Number(t.value);if(t.id==='performer'){r.deadline=null;r.remaining=180}}else if(t.dataset.assignment!==undefined)r.assignments[Number(t.dataset.assignment)]=t.value;save();render()}catch(err){notice(err.message)}});
render();setInterval(tick,250);
</script></body></html>
